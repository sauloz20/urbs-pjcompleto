<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Urbs - Painel de Controle</title>
    <link rel="stylesheet" href="css/painel.css" />
  </head>
  <body>
    <h2>Urbs - Teste de Integração</h2>

    <!-- FORMULÁRIO DE LOGIN -->
    <div class="card">
      <h3>1. Fazer Login</h3>
      <input type="email" id="loginEmail" placeholder="Seu E-mail (ex: davi@urbs.pt)" />
      <input type="password" id="loginSenha" placeholder="Sua Senha" />
      <button onclick="logar()">Entrar</button>
      <p id="msgLogin" class="mensagem"></p>
    </div>

    <!-- FORMULÁRIO DE NOVA OCORRÊNCIA -->
    <div class="card" id="areaOcorrencia" style="opacity: 0.5; pointer-events: none">
      <h3>2. Registrar Ocorrência</h3>
      <p style="font-size: 12px; color: #666">(Só funciona após o login)</p>
      <input type="text" id="titulo" placeholder="Título (ex: Buraco na via)" />
      <input type="text" id="descricao" placeholder="Descrição" />
      <select id="categoria">
        <option value="1">Buracos em vias públicas</option>
        <option value="2">Iluminação pública</option>
      </select>
      <!-- Coordenadas fictícias de Montes Claros para teste -->
      <input type="number" id="lat" value="-16.7286" placeholder="Latitude" />
      <input type="number" id="lng" value="-43.8582" placeholder="Longitude" />
      <button onclick="criarOcorrencia()">Salvar Ocorrência</button>
      <p id="msgOcorrencia" class="mensagem"></p>
    </div>

    <!-- BOTÃO PARA ABRIR O MAPA -->
    <div class="card">
      <h3>3. Visualizar no Mapa</h3>
      <button onclick="window.open('mapa.html', '_blank')" style="background: #10b981">
        Abrir Mapa de Ocorrências
      </button>
    </div>

    <script src="js/painel.js"></script>
  </body>
</html>
